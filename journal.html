      <h2>The Core Question</h2>
      <p>If you own a property or are considering buying one as an investment, you'll face a fundamental choice: let it to a long-term tenant under a standard AST (Assured Shorthold Tenancy), or operate it as serviced accommodation (SA) — short-let furnished rooms rented on platforms like Airbnb, Booking.com, or directly to guests.</p>
      <p>Both models can work well. The right choice depends on your property, your location, your risk tolerance, and how hands-on you want to be. Here's an honest comparison.</p>

      <h2>Returns: How Do They Actually Compare?</h2>
      <p>In high-demand UK cities, SA can generate 2–3× the gross income of a traditional let on the same property. A 2-bedroom flat in Canary Wharf that might achieve £2,200/month on a standard let could generate £4,500–£6,000/month gross on SA.</p>
      <p>But the gross figure isn't the net figure. SA comes with significantly higher costs: platform commissions (15%), professional cleaning (£60–£120 per changeover), linen supply, consumables, maintenance (properties take more wear with frequent guests), and potentially a management fee if you're not self-managing.</p>
      <p>Net yields on well-managed SA in prime UK locations typically run 30–60% above equivalent BTL yields — but the variance is wide. A property in a weak SA market, or one poorly managed, can easily underperform a simple long let.</p>

      <h2>Management Demands</h2>
      <p>This is where most landlords get the SA calculation wrong. SA is not a passive investment in the way a long let can be.</p>
      <ul>
        <li><strong>BTL:</strong> Find a tenant, sign an AST, collect rent monthly, deal with maintenance. Largely set-and-forget with a good letting agent.</li>
        <li><strong>SA (self-managed):</strong> Manage guest enquiries and bookings, coordinate check-ins and check-outs, arrange cleaning between every guest, manage pricing dynamically, handle reviews, maintain the property to a hotel standard. This is essentially running a hospitality business.</li>
        <li><strong>SA (professionally managed):</strong> You pay a management fee (typically 15–20% of revenue) and hand everything over. Your net returns are lower, but the time demand is comparable to BTL.</li>
      </ul>

      <h2>Compliance and Risk</h2>
      <p>SA comes with more compliance requirements than BTL:</p>
      <ul>
        <li>Fire risk assessment and appropriate equipment (smoke detectors, CO detectors, fire extinguishers)</li>
        <li>EPC requirements (minimum E rating)</li>
        <li>Gas and electrical safety certificates</li>
        <li>Local licensing — some councils now require SA licences; always check your local authority</li>
        <li>HMRC classification — SA may qualify as a Furnished Holiday Let (FHL) with specific tax rules; always consult an accountant</li>
        <li>Insurance — standard BTL insurance won't cover SA; you need specialist short-let cover</li>
        <li>Mortgage terms — many residential and BTL mortgages prohibit SA; check with your lender</li>
      </ul>

      <h2>Location Is Everything for SA</h2>
      <p>SA income is highly location-dependent in a way that BTL isn't. A mediocre flat in Canary Wharf outperforms an excellent house in a rural market town on SA. The key demand drivers are:</p>
      <ul>
        <li>Proximity to business districts and conference centres</li>
        <li>Transport links — near a major station, airport, or tube stop</li>
        <li>Tourism and leisure draw — near stadiums, arenas, attractions</li>
        <li>Healthcare clusters — NHS staff and medical contractors are steady, year-round SA tenants</li>
        <li>Universities — less year-round demand but strong peaks during term time and graduation</li>
      </ul>

      <h2>The Honest Recommendation</h2>
      <p>SA is not right for every property or every landlord. For a property in a prime urban location with strong short-stay demand, professionally managed SA will almost certainly outperform a standard let, net of all costs. For a property in a weaker market, or an owner who doesn't want any operational involvement, a long let remains the safer, simpler choice.</p>
      <p>The best landlords we work with treat SA as a business decision, not a side hustle. They choose the right properties, ensure compliance, use professional management, and track their returns properly.</p>
